name = "shieldaudit-superpdp-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Autorise n'importe quelle origine par défaut ; remplace "*" par l'URL exacte
# où index.html est hébergé (ex: "https://liveshop666.github.io") si tu veux
# restreindre l'accès au relais à ta seule page.
ALLOWED_ORIGIN = "*"

# SUPERPDP_CLIENT_ID et SUPERPDP_CLIENT_SECRET sont des SECRETS : ne jamais
# les écrire ici ni dans un fichier versionné. Une fois le worker créé,
# exécute :
#   npx wrangler secret put SUPERPDP_CLIENT_ID
#   npx wrangler secret put SUPERPDP_CLIENT_SECRET
# et colle les valeurs générées dans le portail SUPER PDP (Bac à sable →
# Applications → ta application → Identifiant / Secret) quand c'est demandé.
# Voir README.md.

# Optionnel : décommente et adapte si l'adresse de l'API ou du serveur
# d'authentification diffèrent des valeurs par défaut dans worker.js
# (api.superpdp.tech).
# SUPERPDP_API_URL = "https://api.superpdp.tech"
# SUPERPDP_TOKEN_URL = "https://api.superpdp.tech/oauth2/token"

# SUPER PDP exige une adresse électronique Peppol pour le vendeur
# (Seller.ElectronicAddress). Par défaut, worker.js utilise la ligne
# d'annuaire Peppol du bac à sable "Burger Queen" (0225:315143296_99141,
# visible dans le portail SUPER PDP → Bac à sable → Burger Queen → Lignes
# d'annuaire) — uniquement valable en bac à sable. Une fois le vrai SIRET
# obtenu (et l'entreprise enregistrée dans l'annuaire en production),
# décommente et adapte ces deux valeurs :
# SUPERPDP_SELLER_ENDPOINT_SCHEME = "0225"
# SUPERPDP_SELLER_ENDPOINT_ID = "TON_SIRET_ICI"

# SUPER PDP exige aussi l'identifiant d'enregistrement légal du vendeur
# (Seller.LegalRegistrationIdentifier) — DOIT correspondre au "Numéro
# d'entreprise" affiché sur la page de l'entreprise du bac à sable liée au
# client_id/secret (000000002 pour "Burger Queen", visible en haut de sa
# page — différent de la ligne d'annuaire Peppol ci-dessus). Une fois le
# vrai SIRET obtenu, décommente et adapte ces deux valeurs :
# SUPERPDP_SELLER_LEGAL_SCHEME = "0002"
# SUPERPDP_SELLER_LEGAL_ID = "TON_SIRET_ICI"
