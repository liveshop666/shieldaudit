name = "shieldaudit-iopole-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Autorise n'importe quelle origine par défaut ; remplace "*" par l'URL exacte
# où index.html est hébergé (ex: "https://liveshop666.github.io") si tu veux
# restreindre l'accès au relais à ta seule page.
ALLOWED_ORIGIN = "*"

# IOPOLE_API_KEY et IOPOLE_CUSTOMER_ID sont des SECRETS : ne jamais les
# écrire ici ni dans un fichier versionné. Une fois le worker créé, exécute :
#   npx wrangler secret put IOPOLE_API_KEY
#   npx wrangler secret put IOPOLE_CUSTOMER_ID
# et colle les valeurs correspondantes quand c'est demandé.
# (IOPOLE_CUSTOMER_ID est l'identifiant obtenu après l'enrôlement KYC/KYB de
# ShieldAudit sur iopole — voir README.md.)

# Optionnel : décommente et adapte si l'endpoint diffère de la valeur par
# défaut dans worker.js (sandbox : api.ppd.iopole.fr).
# IOPOLE_API_URL = "https://api.ppd.iopole.fr/v1/invoice"
